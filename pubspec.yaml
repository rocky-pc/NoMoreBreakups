name: no_more_breakups
description: A supportive community app to navigate and prevent breakups through stories and relationship advice.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

  flutter:
    sdk: flutter

  # Backend & Auth
  supabase_flutter: ^2.5.0

  # State Management
  flutter_riverpod: ^2.5.1

  # UI & Media
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.0
  flutter_image_compress: ^2.3.0
  intl: ^0.19.0
  share_plus: ^10.0.0
  record: ^7.1.1
  audioplayers: ^6.0.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
